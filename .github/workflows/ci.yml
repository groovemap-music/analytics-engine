name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 6"
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@2f34a4da5c552bc23c75edd3d8d81be0a4b3271c
    with:
      runner: ubuntu-24.04
      language: python
      setup-command: just setup
      check-command: just check
      coverage-command: just test
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just source-check
      package-command: just build
      install-command: just install-check
      image-command: just image
      coverage-files: coverage.xml
      coverage-flags: python,analytics
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
