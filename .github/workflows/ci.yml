name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 6"
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: groovemap-music/.github/.github/workflows/reusable-ci.yml@c5bf723cad17fa10c0b758a005d6565f47f04f36
    with:
      runner: ubuntu-24.04
      requires-private-library: true
      setup-command: just setup
      check-command: just check
      fallback-command: just source-check
      audit-command: just audit
      image-command: just image
      coverage-flags: python,analytics
    secrets: inherit
