---
openapi: 3.1.0
info:
  title: GrooveMap internal insights API
  version: 1.3.0
  description: Catalog API-owned contract consumed by the analytics engine.
security:
  - InternalSecret: []
paths:
  /api/internal/insights/artist-centrality:
    get:
      operationId: artist_centrality
      parameters:
        - $ref: "#/components/parameters/ArtistCentralityLimit"
      responses:
        "200": {$ref: "#/components/responses/Items"}
  /api/internal/insights/genre-trends:
    get:
      operationId: genre_trends
      responses:
        "200": {$ref: "#/components/responses/Items"}
  /api/internal/insights/style-year-counts:
    get:
      operationId: style_year_counts
      description: >-
        Release and master counts per style and release year, each style's genre
        co-occurrence shares, and release counts per genre and release year. Release year,
        never master year, is the bucket; undated releases are left out of the year cells.
        Shares are raw: no floor is applied, the consumer owns the parent threshold. The read
        scans every release-style tag, so it runs under a long internal budget.
      x-groovemap-max-processing-seconds: 300
      responses:
        "200": {$ref: "#/components/responses/StyleYearCounts"}
        "503":
          description: Neo4j gave up on the read with a retryable error, or is not ready.
  /api/internal/insights/label-longevity:
    get:
      operationId: label_longevity
      parameters:
        - $ref: "#/components/parameters/LabelLongevityLimit"
      responses:
        "200": {$ref: "#/components/responses/Items"}
  /api/internal/insights/anniversaries:
    get:
      operationId: anniversaries
      parameters:
        - $ref: "#/components/parameters/AnniversaryYear"
        - $ref: "#/components/parameters/AnniversaryMonth"
        - $ref: "#/components/parameters/AnniversaryMilestones"
      responses:
        "200": {$ref: "#/components/responses/Items"}
  /api/internal/insights/data-completeness:
    get:
      operationId: data_completeness
      responses:
        "200": {$ref: "#/components/responses/Items"}
  /api/internal/insights/community-enrichment:
    get:
      operationId: community_enrichment
      x-groovemap-max-processing-seconds: 1500
      responses:
        "200": {$ref: "#/components/responses/CommunityEnrichment"}
  /api/internal/insights/rarity-scores:
    get:
      operationId: rarity_scores
      responses:
        "200": {$ref: "#/components/responses/RarityScores"}
components:
  securitySchemes:
    InternalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
  parameters:
    ArtistCentralityLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    LabelLongevityLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    AnniversaryYear:
      name: year
      in: query
      required: true
      schema: {type: integer}
    AnniversaryMonth:
      name: month
      in: query
      required: true
      schema: {type: integer, minimum: 1, maximum: 12}
    AnniversaryMilestones:
      name: milestones
      in: query
      required: false
      schema: {type: string, default: "25,30,40,50,75,100"}
  schemas:
    StyleYearCount:
      description: One style and release year that has at least one dated release.
      type: object
      required: [style, year, release_count, master_count]
      properties:
        style: {type: string}
        year: {type: integer, minimum: 1}
        release_count:
          type: integer
          minimum: 1
          description: Distinct releases tagged with the style whose own release year is `year`.
        master_count:
          type: integer
          minimum: 0
          description: Distinct masters those releases derive from; masterless releases add none.
      additionalProperties: false
    GenreYearCount:
      description: One genre and release year that has at least one dated release.
      type: object
      required: [genre, year, release_count]
      properties:
        genre: {type: string}
        year: {type: integer, minimum: 1}
        release_count:
          type: integer
          minimum: 1
          description: Distinct releases tagged with the genre whose own release year is `year`.
      additionalProperties: false
    StyleParentShare:
      description: A genre that co-occurs with a style, with its raw share of the style's releases.
      type: object
      required: [style, genre, release_count, style_release_count, share]
      properties:
        style: {type: string}
        genre: {type: string}
        release_count:
          type: integer
          minimum: 1
          description: Releases tagged with both the style and the genre.
        style_release_count:
          type: integer
          minimum: 1
          description: All releases tagged with the style, dated or not.
        share:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            `release_count / style_release_count`. Shares do not sum to one because releases
            carry several genres. Unfloored.
      additionalProperties: false
    CommunityEnrichmentResult:
      type: object
      required: [enriched, skipped, errors, remaining]
      properties:
        enriched: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        remaining: {type: integer, minimum: 0}
        error:
          type: string
          enum: [no_credentials]
      additionalProperties: false
    RarityScoreItem:
      description: >-
        One release's rarity computation. Per ADR 0007 the core score is media-neutral;
        `pressing_scarcity` is populated only for grooved media (vinyl, shellac,
        grooved_other) and is `null` otherwise. `format_rarity` is deprecated for one
        minor version: still computed and present at weight `0.0`, superseded by
        `medium_rarity`.
      type: object
      required:
        - release_id
        - title
        - artist_name
        - year
        - rarity_score
        - tier
        - hidden_gem_score
        - pressing_scarcity
        - label_catalog
        - format_rarity
        - temporal_scarcity
        - graph_isolation
        - collection_prevalence
        - medium_rarity
        - media_families
        - family_signals
      properties:
        release_id: {type: string}
        title: {type: string}
        artist_name: {type: string}
        year: {type: [integer, "null"]}
        rarity_score: {type: number}
        tier: {type: string}
        hidden_gem_score: {type: number}
        pressing_scarcity:
          type: [number, "null"]
          description: Grooved-only signal; `null` when no family extension claims the release.
        label_catalog: {type: number}
        format_rarity:
          type: number
          deprecated: true
          description: Raw Discogs format name signal, kept for one minor version at weight 0.0.
        temporal_scarcity: {type: number}
        graph_isolation: {type: number}
        collection_prevalence: {type: number}
        medium_rarity:
          type: [number, "null"]
          description: Canonical-medium rarity score (ADR 0007); replaces `format_rarity`.
        media_families:
          type: array
          items: {type: string}
          description: Canonical ADR 0007 media family ids the release covers.
        family_signals:
          type: object
          additionalProperties: true
          description: Per-family-extension signal scores keyed by module id (e.g. `grooved`).
      additionalProperties: true
  responses:
    Items:
      description: A successful computation input response.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: {type: object, additionalProperties: true}
            additionalProperties: false
    CommunityEnrichment:
      description: Community enrichment counters for the completed bounded batch.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CommunityEnrichmentResult"}
    StyleYearCounts:
      description: Style-by-release-year counts, per-style genre shares and genre-by-release-year counts.
      content:
        application/json:
          schema:
            type: object
            required: [style_years, style_parents, genre_years]
            properties:
              style_years:
                type: array
                items: {$ref: "#/components/schemas/StyleYearCount"}
              style_parents:
                type: array
                items: {$ref: "#/components/schemas/StyleParentShare"}
              genre_years:
                type: array
                items: {$ref: "#/components/schemas/GenreYearCount"}
            additionalProperties: false
    RarityScores:
      description: Rarity score data for every release, media-neutral core plus family extensions.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: {$ref: "#/components/schemas/RarityScoreItem"}
            additionalProperties: false
